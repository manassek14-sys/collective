<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a1020">
  <title>COLLECTIVE — Espace de gestion</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">C</div>
        <div>
          <b>COLLECTIVE</b>
          <small>Épargne & investissement</small>
        </div>
      </div>
      <nav id="nav">
        <button class="nav-item active" data-page="dashboard"><span class="ico">TB</span> Tableau de bord</button>
        <button class="nav-item" data-page="members"><span class="ico">MB</span> Membres</button>
        <button class="nav-item" data-page="contributions"><span class="ico">CT</span> Cotisations</button>
        <button class="nav-item" data-page="tontine"><span class="ico">TN</span> Tontine (Redistribution)</button>
        <button class="nav-item" data-page="projects"><span class="ico">IV</span> Investissements</button>
        <button class="nav-item" data-page="transactions"><span class="ico">TR</span> Trésor</button>
        <button class="nav-item" data-page="finance"><span class="ico">FR</span> Frais de gestion</button>
        <button class="nav-item" data-page="payments"><span class="ico">PY</span> Paiements</button>
        <button class="nav-item" data-page="reports"><span class="ico">RP</span> Rapports</button>
        <button class="nav-item" data-page="settings"><span class="ico">PR</span> Paramètres</button>
      </nav>
      <div class="sidebar-foot">
        <a href="hub.html" class="side-link">Mes collectifs</a>
        <button class="side-btn" id="toggleLockBtn">Déverrouiller</button>
        <div class="admin-chip">
          <span class="av">A</span>
          <div><b id="wsName">Admin</b><small id="wsMode">Lecture seule</small></div>
        </div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Tableau de bord</h1>
          <p class="sub" id="pageSub">Voici un aperçu de l’activité de votre association.</p>
        </div>
        <div class="top-actions">
          <span class="pill" id="modePill">Lecture seule</span>
          <span class="pill" id="today"></span>
          <button class="btn btn-light" id="exportAll">Exporter</button>
        </div>
      </header>
      <div id="pageContent"></div>
    </main>
  </div>
  <div id="modalRoot"></div>
  <div class="toast" id="toast"></div>
  <input id="importFile" type="file" accept="application/json" hidden>
  <script src="app.js"></script>
</body>
</html>
